connection:
  address: "udp://:14540"
  timeout_seconds: 30

mission:
  altitude_m: 20.0
  speed_m_s: 4.0
  return_to_launch_after_mission: true
  waypoints:
    - north_m: -120.0
      east_m: -100.0
    - north_m: -100.0
      east_m: -100.0
    - north_m: -100.0
      east_m: -60.0
    - north_m: -90.0
      east_m: -60.0
    - north_m: -90.0
      east_m: -40.0
    - north_m: -80.0
      east_m: -40.0
    - north_m: -80.0
      east_m: 0.0
    - north_m: 0.0
      east_m: 0.0

safety:
  global_position_timeout_seconds: 30
